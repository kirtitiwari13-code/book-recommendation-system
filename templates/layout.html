<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookWise</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; margin: 0;">
    <header style="padding: 10px 0;">
        <nav style="display: flex; justify-content: space-between; align-items: center; padding: 0 5%;">
            <div class="logo" style="font-size: 1.5rem; font-weight: bold;">
                <a href="/" style="color: white; text-decoration: none;">BookWise</a>
            </div>

            <div class="search-container">
                <form action="/search" method="GET" style="display: flex; gap: 5px;">
                    <input type="text" name="query" placeholder="Search books..." required 
                           style="padding: 8px; border-radius: 20px; border: none; width: 200px;">
                    <button type="submit" style="padding: 8px 15px; border-radius: 20px; border: none; background: #ff4757; color: white; cursor: pointer;">
                        Search
                    </button>
                </form>
            </div>

            <ul style="display: flex; list-style: none; gap: 20px; margin: 0; padding: 0;">
                <li><a href="/" style="color: white; text-decoration: none; font-weight: 500;">Home</a></li>
    		{% if session.user_id %}
    		<li><a href="/logout"style="color: white; text-decoration: none; font-weight: 500;">Logout</a></li>
		<li><a href="/read"style="color: white; text-decoration: none; font-weight: 500;">Read</a></li>
		<li><a href="/reading"style="color: white; text-decoration: none; font-weight: 500;">Reading</a></li>
		{% else %}
     		<li><a href="/login"style="color: white; text-decoration: none; font-weight: 500;">Login</a></li>
		{% endif %}
                <li><a href="/about" style="color: white; text-decoration: none; font-weight: 500;">About</a></li>
            </ul>
        </nav>
    </header>

    <main style="flex: 1;">
        {% block content %}{% endblock %}
    </main>

    <footer style="background: #333; color: white; text-align: center; padding: 20px 0; margin-top: 40px;">
        <p>&copy; 2026 BookWise | Built for Book Lovers by Amrita :)</p>
    </footer>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
